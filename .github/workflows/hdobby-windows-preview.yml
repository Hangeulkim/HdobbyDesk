name: HdobbyDesk Windows preview

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Preserve source line endings for the submodule patch
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - shell: bash
        run: |
          git -C libs/hbb_common -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
          git show HEAD:patches/hbb-common-private-network.patch > patches/hbb-common-private-network.patch
          python scripts/apply_private_network.py --apply
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.81.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: hdobby-windows-preview
          cache-on-failure: true
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: '15.0.6'
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Apply matching Flutter UI patch
        shell: bash
        run: |
          git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          cd flutter
          flutter pub get
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
          doNotCache: false
      - name: Build native dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: '"$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"'
      - name: Generate matching bindings
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build complete application
        shell: bash
        run: python build.py --portable --flutter --hwcodec --skip-portable-pack
      - name: Verify and package complete application
        shell: pwsh
        run: |
          $bundle = Resolve-Path 'flutter/build/windows/x64/runner/Release'
          foreach ($required in @('hdobbydesk.exe', 'libhdobbydesk.dll', 'flutter_windows.dll', 'data/icudtl.dat', 'data/flutter_assets')) {
            if (!(Test-Path (Join-Path $bundle $required))) { throw "Missing package component: $required" }
          }
          $probe = Start-Process (Join-Path $bundle 'hdobbydesk.exe') -WorkingDirectory $bundle -PassThru
          try {
            Start-Sleep -Seconds 15
            $probe.Refresh()
            if ($probe.HasExited) { throw "Application exited during startup: $($probe.ExitCode)" }
            if ($probe.MainWindowHandle -eq 0) { throw 'Application did not create a window' }
          } finally {
            if (!$probe.HasExited) { Stop-Process -Id $probe.Id }
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path "$bundle/*" -DestinationPath dist/HdobbyDesk-windows-x64-preview.zip
          python -m pip install brotli==1.1.0
          python libs/portable/generate.py -f "$bundle" -o libs/portable -e "$bundle/hdobbydesk.exe" -l 6
          if ($LASTEXITCODE -ne 0) { throw 'Portable EXE packaging failed' }
          Copy-Item target/release/hdobbydesk-portable-packer.exe dist/HdobbyDesk-windows-x64.exe
          $hashes = Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Get-FileHash -Algorithm SHA256
          $hashes | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: HdobbyDesk-windows-x64-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
