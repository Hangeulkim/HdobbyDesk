name: HdobbyDesk Windows package check

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Windows preview build run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - shell: bash
        run: python scripts/apply_private_network.py --apply
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.81.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: HdobbyDesk-windows-x64-preview
          path: package
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Check hashes and launch both distributed packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class PreviewWindow {
            [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out Rect r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          '@
          New-Item -ItemType Directory -Path ui-check -Force | Out-Null
          foreach ($line in Get-Content package/SHA256SUMS.txt) {
            $parts = $line -split '  ', 2
            if ($parts.Length -ne 2 -or $parts[1] -notin @('LICENSE', 'HdobbyDesk-windows-x64-preview.zip', 'HdobbyDesk-windows-x64.exe')) { throw 'Unexpected checksum entry' }
            $actual = (Get-FileHash (Join-Path package $parts[1]) -Algorithm SHA256).Hash
            if ($actual -ne $parts[0]) { throw "Checksum mismatch: $($parts[1])" }
          }
          Expand-Archive package/HdobbyDesk-windows-x64-preview.zip unpacked
          # App-local CRT deployment follows Microsoft and Flutter deployment guidance.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'Redistributable x64 C++ runtime folder missing' }
          Copy-Item "$($crt.FullName)/*.dll" unpacked/
          Copy-Item LICENCE unpacked/LICENSE
          foreach ($runtime in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (!(Test-Path "unpacked/$runtime")) { throw "Missing runtime: $runtime" }
          }
          Remove-Item package/HdobbyDesk-windows-x64-preview.zip
          Compress-Archive -Path unpacked/* -DestinationPath package/HdobbyDesk-windows-x64-preview.zip
          python -m pip install brotli==1.1.0
          $finalBundle = (Resolve-Path unpacked).Path
          python libs/portable/generate.py -f "$finalBundle" -o libs/portable -e "$finalBundle/hdobbydesk.exe" -l 6
          if ($LASTEXITCODE -ne 0) { throw 'Final portable EXE packaging failed' }
          Copy-Item target/release/hdobbydesk-portable-packer.exe package/HdobbyDesk-windows-x64.exe -Force
          $hashes = Get-ChildItem package -File | Where-Object Name -ne 'SHA256SUMS.txt' | Get-FileHash -Algorithm SHA256
          $hashes | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content package/SHA256SUMS.txt
          function Assert-AppWindow([string]$launcher, [string]$expectedPath, [string]$captureName) {
            $launcher = (Resolve-Path $launcher).Path
            $expectedPath = [System.IO.Path]::GetFullPath($expectedPath)
            $parent = Start-Process $launcher -WorkingDirectory (Split-Path $launcher) -PassThru
            $found = $null
            try {
              for ($attempt = 0; $attempt -lt 45; $attempt++) {
                Start-Sleep -Seconds 1
                $found = Get-Process hdobbydesk -ErrorAction SilentlyContinue | Where-Object { $_.Path -and [System.IO.Path]::GetFullPath($_.Path) -eq $expectedPath -and $_.MainWindowHandle -ne 0 } | Select-Object -First 1
                if ($found) { break }
              }
              if (!$found) {
                $parent.Refresh()
                Write-Output "Launcher exited: $($parent.HasExited)"
                if ($parent.HasExited) { Write-Output "Launcher exit code: $($parent.ExitCode)" }
                Write-Output "Expected executable exists: $(Test-Path $expectedPath)"
                Get-Process hdobbydesk -ErrorAction SilentlyContinue | Select-Object Id,Path,MainWindowHandle | Format-Table -AutoSize
                Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in @('Application Error','Windows Error Reporting') } | Select-Object -First 3 -ExpandProperty Message
                throw 'Distributed application did not create a window'
              }
              Start-Sleep -Seconds 10
              $found.Refresh()
              if ($found.HasExited) { throw 'Distributed application exited after launch' }
              [PreviewWindow]::SetForegroundWindow($found.MainWindowHandle) | Out-Null
              Start-Sleep -Seconds 2
              $rect = New-Object PreviewWindow+Rect
              if (![PreviewWindow]::GetWindowRect($found.MainWindowHandle, [ref]$rect)) { throw 'Cannot read application window bounds' }
              $bitmap = [System.Drawing.Bitmap]::new(($rect.Right - $rect.Left), ($rect.Bottom - $rect.Top))
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
                $bitmap.Save((Join-Path (Resolve-Path ui-check) $captureName), [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                $graphics.Dispose()
                $bitmap.Dispose()
              }
              Write-Output 'Distributed package window and startup stability check passed.'
            } finally {
              $ownedIds = @(Get-Process hdobbydesk -ErrorAction SilentlyContinue | Where-Object { $_.Path -and [System.IO.Path]::GetFullPath($_.Path) -eq $expectedPath } | Select-Object -ExpandProperty Id)
              foreach ($ownedId in $ownedIds) {
                Stop-Process -Id $ownedId -Force -ErrorAction SilentlyContinue
              }
              $parent.Refresh()
              if (!$parent.HasExited) { Stop-Process -Id $parent.Id -Force -ErrorAction SilentlyContinue }
            }
          }
          $zipExe = (Resolve-Path unpacked/hdobbydesk.exe).Path
          Assert-AppWindow $zipExe $zipExe 'zip-ui.png'
          $portableExe = Join-Path $env:LOCALAPPDATA 'hdobbydesk/hdobbydesk.exe'
          Assert-AppWindow package/HdobbyDesk-windows-x64.exe $portableExe 'portable-ui.png'
          'Package checksums, extracted ZIP launch, portable EXE extraction and launch: PASS' | Out-File $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-package-ui-check
          path: ui-check/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: HdobbyDesk-windows-x64-final
          path: package/
          if-no-files-found: error
          retention-days: 14
